[project]
name = "jobmarket_streamlit"
version = "0.1.0"
description = "Streamlit dashboard for the jobmarket data platform"
requires-python = ">=3.12"
dependencies = [
    "branca>=0.8.2",
    "dotenv>=0.9.9",
    "duckdb>=1.4.1",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "streamlit>=1.50.0",
    "streamlit-folium>=0.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmarket_streamlit"]
