[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobmarket-hr-analytics"
version = "0.1.0"
description = "Monorepo/Workspace for the jobmarket data platform"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
]

[tool.uv.workspace]
members = [
    "dagster",
    "dbt",    
    "streamlit",
]

[tool.uv]
package = false
