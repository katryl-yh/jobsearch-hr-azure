[project]
name = "jobmarket_pipelines"
version = "0.1.0"
description = "Dagster pipelines for the jobmarket data platform"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.11.15",
    "dagster-dbt>=0.27.15",
    "dagster-dlt>=0.27.15",
    "dagster-duckdb>=0.27.15",
    "dlt>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmarket_pipelines"]
