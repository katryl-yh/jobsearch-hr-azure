[project]
name = "jobmarket_dbt"
version = "0.1.0"
description = "DBT transformations for the jobmarket data platform"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10.13",
    "dbt-duckdb>=1.9.6",
    "dbt-snowflake>=1.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
