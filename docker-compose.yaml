version: "3.9"

services:
  dagster:
    build:
      context: .
      dockerfile: Dockerfile.elt
    ports:
      - "3000:3000"
    environment:
      - DATA_DIR=/data
      - DAGSTER_HOME=/home/dagster/dagster_home
      - DBT_PROJECT_DIR=/app/dbt/jobmarket_dbt
    volumes:
      - ./data:/data
      - dagster-home:/home/dagster/dagster_home
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-m", "moo"]

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "8501:8501"
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    depends_on:
      - dagster

volumes:
  dagster-home: