services:
  # Dagster orchestration service for data pipelines
  dagster:
    build:
      context: .
      dockerfile: Dockerfile.elt
    ports:
      # Dagster web UI port
      - "3000:3000"
    environment:
      # Path to DuckDB database file inside container
      - DUCKDB_PATH=/mnt/data/job_ads.duckdb
    volumes:
      # Persist Dagster metadata and logs
      # - dagster-home:/mnt/dagster_home
      # DBT configuration files
      - ./.dbt:/mnt/.dbt
      # Shared data directory
      - ./data:/mnt/data

  # Streamlit dashboard service
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      # Streamlit web UI port
      - "8501:8501"
    environment:
      # Path to DuckDB database file (same as dagster)
      - DUCKDB_PATH=/mnt/data/job_ads.duckdb
    volumes:
      # Read-only access to processed data
      - ./data:/mnt/data

volumes:
  # Named volume for Dagster persistence
  dagster-home: